<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot da Penha</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000000;
            font-family: Arial, sans-serif;
        }

        .chat {
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
        }

        .cabecalho {
            width: 100%;
            height: 90px;
            flex-shrink: 0;

            background: linear-gradient(135deg, #8e24aa, #d81b91);

            color: white;
            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .conversa {
            flex: 1;
            background: #000000;
            overflow-y: auto;
            padding: 30px;
        }

        /* MENSAGENS */
        .mensagem {
            padding: 15px 20px;
            border-radius: 20px;
            width: fit-content;
            max-width: 70%;
            margin-bottom: 15px;
            font-size: 18px;
            word-wrap: break-word;
        }

        /* MENSAGEM DO USUÁRIO */
        .usuario {
            background: #8e24aa;
            color: white;
            margin-left: auto;
        }

        /* MENSAGEM DO BOT */
        .bot {
            background: #2a2a2a;
            color: white;
            margin-right: auto;
        }

        .area-mensagem {
            width: 100%;
            padding: 22px 35px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: #000000;
        }

        .campo-mensagem {
            flex: 1;
            height: 65px;
            border: none;
            border-radius: 40px;
            padding: 0 30px;

            background: #8e24aa;
            color: white;
            font-size: 19px;
            outline: none;

            box-shadow: 0 0 10px rgba(142, 36, 170, 0.25);
        }

        .campo-mensagem::placeholder {
            color: white;
            opacity: 1;
        }

        .botao-enviar {
            width: 65px;
            height: 65px;
            flex-shrink: 0;

            border: none;
            border-radius: 50%;

            background: #8e24aa;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: all 0.2s ease;
        }

        .aviao {
            width: 35px;
            height: 35px;
            transform: rotate(-10deg);
        }

        .aviao path {
            fill: none;
            stroke: #000000;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .botao-enviar:hover {
            background: #d81b91;
            transform: scale(1.08);
        }

        .botao-enviar:active {
            transform: scale(0.95);
        }

        .conversa::-webkit-scrollbar {
            width: 10px;
        }

        .conversa::-webkit-scrollbar-track {
            background: #000000;
        }

        .conversa::-webkit-scrollbar-thumb {
            background: #8e24aa;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="chat">

        <header class="cabecalho">
            bot-da-penha
        </header>

        <main class="conversa"></main>

        <div class="area-mensagem">

            <input
                type="text"
                class="campo-mensagem"
                placeholder="digite a sua mensagem"
            >

            <button
                class="botao-enviar"
                title="Enviar mensagem"
                aria-label="Enviar mensagem">

                <svg class="aviao" viewBox="0 0 100 100">
                    <path d="
                        M 8 35
                        L 92 8
                        L 52 92
                        L 28 62
                        L 20 80
                        L 20 50
                        Z
                    "/>

                    <path d="
                        M 20 50
                        L 92 8
                    "/>
                </svg>

            </button>

        </div>

    </div>


    <script>

        const botao = document.querySelector(".botao-enviar");
        const campo = document.querySelector(".campo-mensagem");
        const conversa = document.querySelector(".conversa");


        function adicionarMensagem(texto, tipo) {

            const mensagem = document.createElement("div");

            mensagem.classList.add("mensagem");
            mensagem.classList.add(tipo);

            mensagem.textContent = texto;

            conversa.appendChild(mensagem);

            conversa.scrollTop = conversa.scrollHeight;
        }


        // ENVIA A MENSAGEM PARA O SERVER.JS
        async function responderBot(mensagemUsuario) {

            try {

                const resposta = await fetch(
                    "http://localhost:3000/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            mensagem: mensagemUsuario
                        })
                    }
                );


                const dados = await resposta.json();


                if (dados.erro) {

                    adicionarMensagem(
                        "Erro: " + dados.erro,
                        "bot"
                    );

                    return;
                }


                adicionarMensagem(
                    dados.resposta,
                    "bot"
                );

            } catch (erro) {

                adicionarMensagem(
                    "Não foi possível conectar ao servidor.",
                    "bot"
                );

                console.error(erro);

            }

        }


        function enviarMensagem() {

            const texto = campo.value.trim();


            if (texto === "") {
                return;
            }


            // MOSTRA A MENSAGEM DO USUÁRIO
            adicionarMensagem(texto, "usuario");


            // LIMPA O CAMPO
            campo.value = "";


            // ENVIA PARA A IA
            responderBot(texto);

        }


        // CLICAR NO BOTÃO
        botao.addEventListener("click", enviarMensagem);


        // APERTAR ENTER
        campo.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                enviarMensagem();
            }

        });

    </script>

</body>
</html>
